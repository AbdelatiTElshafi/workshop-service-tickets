<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RT — الصيانة</title>
<link rel="icon" href="/rt-logo.jpg">
<style>
  :root {
    --bg:#f3f4f6; --card:#fff; --line:#e5e7eb; --line2:#d1d5db; --ink:#0a0a0a; --ink2:#374151; --muted:#6b7280;
    --black:#0a0a0a; --side:#0a0a0a; --side-ink:#d4d4d4; --hover:#f9fafb;
    --blue:#2563eb; --green:#16a34a; --red:#dc2626; --amber:#d97706; --purple:#7c3aed; --cyan:#0891b2; --teal:#0d9488; --slate:#475569; --pink:#db2777;
    --r:10px; --shadow:0 1px 2px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.06); --shadow2:0 20px 50px rgba(0,0,0,.25);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font:14px/1.55 "Segoe UI", Tahoma, sans-serif; background:var(--bg); color:var(--ink); }
  a { color:inherit; }
  button, input, select, textarea { font:inherit; color:inherit; }
  .hidden { display:none !important; }

  /* ---------- login */
  #login { min-height:100vh; display:grid; grid-template-columns:1fr 1fr; }
  #login .brand { background:var(--black); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:30px; }
  #login .brand img { width:140px; height:140px; border-radius:50%; }
  #login .brand h1 { margin:0; font-size:26px; } #login .brand p { margin:0; color:#a3a3a3; }
  #login .form { display:flex; align-items:center; justify-content:center; padding:30px; background:#fff; }
  #login .form > div { width:100%; max-width:340px; }
  #login h2 { margin:0 0 4px; font-size:22px; }
  @media (max-width:760px) { #login { grid-template-columns:1fr; } #login .brand { padding:40px 20px; } #login .brand img { width:90px; height:90px; } }

  /* ---------- shell */
  #app { display:flex; min-height:100vh; }
  aside { width:236px; flex-shrink:0; background:var(--side); color:var(--side-ink); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  aside .logo { display:flex; align-items:center; gap:10px; padding:18px 16px; border-bottom:1px solid #222; }
  aside .logo img { width:42px; height:42px; border-radius:50%; background:#fff; }
  aside .logo b { color:#fff; font-size:16px; display:block; } aside .logo span { font-size:12px; color:#8a8a8a; }
  aside nav { padding:10px 8px; display:flex; flex-direction:column; gap:2px; flex:1; overflow:auto; }
  aside nav a { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; text-decoration:none; color:var(--side-ink); cursor:pointer; }
  aside nav a:hover { background:#1c1c1c; color:#fff; }
  aside nav a.on { background:#fff; color:#000; font-weight:600; }
  aside nav a svg { width:18px; height:18px; flex-shrink:0; }
  aside nav a .cnt { margin-inline-start:auto; background:var(--red); color:#fff; border-radius:10px; font-size:11px; padding:0 7px; }
  aside .me { padding:12px 14px; border-top:1px solid #222; font-size:13px; }
  aside .me b { color:#fff; display:block; } aside .me span { color:#8a8a8a; }
  aside .me .row { margin-top:8px; }
  aside .me button { background:#1c1c1c; color:#ddd; border:1px solid #2a2a2a; padding:4px 10px; border-radius:6px; cursor:pointer; font-size:12px; }
  .main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .top { position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; padding:10px 22px; }
  .top .burger { display:none; }
  .search { flex:1; max-width:560px; position:relative; }
  .search input { width:100%; padding:9px 38px 9px 64px; border:1px solid var(--line2); border-radius:10px; background:#fff; }
  .search svg { position:absolute; right:12px; top:50%; transform:translateY(-50%); width:17px; color:var(--muted); }
  .search kbd { position:absolute; left:10px; top:50%; transform:translateY(-50%); }
  kbd { font:11px/1 Consolas, monospace; border:1px solid var(--line2); border-bottom-width:2px; border-radius:4px; padding:2px 5px; color:var(--muted); background:#fafafa; }
  #view { padding:22px; max-width:1400px; width:100%; }
  @media (max-width:900px) {
    aside { position:fixed; inset:0 0 0 auto; z-index:50; transform:translateX(100%); transition:transform .2s; }
    body.nav-open aside { transform:none; box-shadow:var(--shadow2); }
    .top .burger { display:inline-flex; }
    #view { padding:14px; }
  }

  /* ---------- basics */
  h1 { font-size:22px; margin:0; } h2 { font-size:17px; margin:0 0 12px; } h3 { font-size:15px; margin:0 0 10px; }
  .page-h { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .page-h .sub { color:var(--muted); font-size:13px; }
  .sp { flex:1; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:18px; margin-bottom:16px; }
  .card.flush { padding:0; overflow:hidden; }
  .card-h { display:flex; align-items:center; gap:10px; margin-bottom:12px; } .card-h h2, .card-h h3 { margin:0; }
  .muted { color:var(--muted); } .small { font-size:12.5px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; gap:14px; }
  .g2 { grid-template-columns:repeat(2,minmax(0,1fr)); } .g3 { grid-template-columns:repeat(3,minmax(0,1fr)); } .g4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .cols { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:16px; align-items:start; }
  @media (max-width:1100px) { .cols { grid-template-columns:1fr; } .g4 { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:640px) { .g2, .g3, .g4 { grid-template-columns:1fr; } }
  .mono { font-family:Consolas, "Courier New", monospace; direction:ltr; unicode-bidi:embed; }
  .num { direction:ltr; unicode-bidi:embed; }

  label.f { display:flex; flex-wrap:wrap; align-items:baseline; font-size:12.5px; color:var(--ink2); font-weight:600; }
  label.f > * { order:1; flex-basis:100%; }
  .mono::placeholder { font-family:"Segoe UI", Tahoma, sans-serif; }
  label.f > input, label.f > select, label.f > textarea, .inp { display:block; width:100%; margin-top:5px; padding:8px 10px; border:1px solid var(--line2); border-radius:8px; background:#fff; font-weight:400; }
  textarea { min-height:76px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid #000; outline-offset:-1px; border-color:#000; }
  .req::after { content:" *"; color:var(--red); }

  .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border:1px solid var(--line2); border-radius:8px; background:#fff; cursor:pointer; white-space:nowrap; text-decoration:none; font-weight:500; }
  .btn:hover { background:var(--hover); border-color:#9ca3af; }
  .btn svg { width:16px; height:16px; }
  .btn.pri { background:#000; color:#fff; border-color:#000; } .btn.pri:hover { background:#262626; }
  .btn.ok { background:var(--green); color:#fff; border-color:var(--green); }
  .btn.danger { color:var(--red); border-color:#fecaca; } .btn.danger:hover { background:#fef2f2; }
  .btn.sm { padding:4px 10px; font-size:13px; } .btn.lg { padding:11px 20px; font-size:15px; }
  .btn.ghost { border-color:transparent; background:transparent; } .btn.ghost:hover { background:#f3f4f6; }
  .btn[disabled] { opacity:.5; pointer-events:none; }

  .chip { display:inline-flex; align-items:center; gap:5px; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; border:1px solid transparent; }
  .chip::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .chip.nodot::before { display:none; }
  .c-gray { background:#f3f4f6; color:#4b5563; } .c-blue { background:#eff6ff; color:#1d4ed8; } .c-cyan { background:#ecfeff; color:#0e7490; }
  .c-amber { background:#fffbeb; color:#b45309; } .c-purple { background:#f5f3ff; color:#6d28d9; } .c-green { background:#f0fdf4; color:#15803d; }
  .c-slate { background:#f1f5f9; color:#334155; } .c-red { background:#fef2f2; color:#b91c1c; } .c-teal { background:#f0fdfa; color:#0f766e; }
  .c-pink { background:#fdf2f8; color:#be185d; } .c-black { background:#000; color:#fff; }

  table.t { width:100%; border-collapse:collapse; }
  table.t th { text-align:start; font-size:12px; color:var(--muted); font-weight:600; padding:10px 12px; background:#fafafa; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.t td { padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.t tr:last-child td { border-bottom:0; }
  table.t tr.click { cursor:pointer; } table.t tr.click:hover td { background:#fafafa; }
  table.t tr.urgent td:first-child { box-shadow:inset -3px 0 0 var(--red); }
  .tbl-wrap { overflow-x:auto; }
  .empty { text-align:center; padding:34px 10px; color:var(--muted); }
  .empty svg { width:42px; height:42px; opacity:.35; display:block; margin:0 auto 8px; }

  /* ---------- KPI */
  .kpi { background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow); cursor:pointer; position:relative; overflow:hidden; }
  .kpi:hover { border-color:#9ca3af; }
  .kpi .l { color:var(--muted); font-size:12.5px; font-weight:600; } .kpi .v { font-size:28px; font-weight:700; margin-top:4px; }
  .kpi::after { content:""; position:absolute; inset:0 0 auto auto; width:4px; height:100%; background:var(--k, #000); }
  .bar { display:flex; height:12px; border-radius:6px; overflow:hidden; background:#f3f4f6; }
  .bar > div { height:100%; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; font-size:12.5px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; cursor:pointer; } .legend i { width:10px; height:10px; border-radius:3px; display:inline-block; }
  .hbar { display:flex; align-items:center; gap:10px; margin:7px 0; font-size:13px; } .hbar .lb { width:120px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbar .tr { flex:1; height:9px; background:#f3f4f6; border-radius:5px; overflow:hidden; } .hbar .tr div { height:100%; background:#000; border-radius:5px; }

  /* ---------- tabs, steps, timeline */
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; overflow-x:auto; scrollbar-width:none; }
  .tabs a { padding:10px 14px; cursor:pointer; color:var(--muted); font-weight:600; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
  .tabs a.on { color:#000; border-color:#000; } .tabs a .n { background:#f3f4f6; border-radius:9px; padding:0 7px; font-size:11px; margin-inline-start:4px; color:var(--ink2); }
  .steps { display:flex; align-items:center; gap:0; margin:14px 0 4px; overflow-x:auto; }
  .steps .s { display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); white-space:nowrap; }
  .steps .s i { width:24px; height:24px; border-radius:50%; border:2px solid var(--line2); display:grid; place-items:center; font-style:normal; font-size:11px; font-weight:700; background:#fff; }
  .steps .s.done i { background:#000; border-color:#000; color:#fff; } .steps .s.done { color:var(--ink); }
  .steps .s.cur i { border-color:#000; color:#000; box-shadow:0 0 0 4px #e5e7eb; } .steps .s.cur { color:#000; font-weight:700; }
  .steps .ln { flex:1; min-width:18px; height:2px; background:var(--line2); margin:0 8px; } .steps .ln.done { background:#000; }
  .kv { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px 20px; }
  .kv > div > span { display:block; font-size:12px; color:var(--muted); margin-bottom:2px; } .kv b { font-weight:600; }
  .tl { position:relative; padding-inline-start:26px; }
  .tl::before { content:""; position:absolute; inset:6px 8px 6px auto; width:2px; background:var(--line); }
  .tl .it { position:relative; margin-bottom:16px; }
  .tl .it::before { content:""; position:absolute; right:-23px; top:5px; width:12px; height:12px; border-radius:50%; background:#fff; border:3px solid var(--dot, #000); }
  .note { background:#fafafa; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .note .h { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .note p { margin:0; white-space:pre-wrap; }
  .alert { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:10px; border:1px solid; margin-bottom:14px; }
  .alert svg { width:20px; height:20px; flex-shrink:0; margin-top:1px; }
  .alert.warn { background:#fffbeb; border-color:#fde68a; color:#92400e; } .alert.info { background:#eff6ff; border-color:#bfdbfe; color:#1e40af; }
  .alert.ok { background:#f0fdf4; border-color:#bbf7d0; color:#166534; } .alert.err { background:#fef2f2; border-color:#fecaca; color:#991b1b; }
  .alert.new { background:#000; border-color:#000; color:#fff; }
  .money { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--line); } .money:last-child { border:0; }
  .money.tot { font-weight:700; font-size:16px; border-bottom:2px solid #000; } .money.bal b { color:var(--red); }

  .seg { display:flex; flex-wrap:wrap; gap:6px; margin-top:5px; }
  .seg label { cursor:pointer; } .seg input { display:none; }
  .seg span { display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border:1px solid var(--line2); border-radius:8px; background:#fff; font-weight:500; font-size:13px; }
  .seg input:checked + span { background:#000; color:#fff; border-color:#000; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .tags button { border:1px dashed var(--line2); background:#fff; border-radius:999px; padding:2px 10px; font-size:12px; cursor:pointer; }
  .tags button:hover { border-color:#000; }
  .thumbs { display:flex; gap:10px; flex-wrap:wrap; }
  .thumbs img { width:120px; height:90px; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:zoom-in; }
  .drop { border:2px dashed var(--line2); border-radius:10px; padding:16px; text-align:center; color:var(--muted); cursor:pointer; background:#fafafa; }
  .drop:hover { border-color:#000; color:#000; }
  .pager { display:flex; align-items:center; gap:8px; padding:10px 14px; border-top:1px solid var(--line); font-size:13px; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .filters select, .filters input { padding:7px 10px; border:1px solid var(--line2); border-radius:8px; background:#fff; }
  .pills { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  .pills a { padding:5px 12px; border-radius:999px; border:1px solid var(--line2); background:#fff; cursor:pointer; font-size:12.5px; font-weight:600; display:inline-flex; gap:6px; align-items:center; }
  .pills a.on { background:#000; color:#fff; border-color:#000; }
  .pills a .n { opacity:.65; font-weight:500; }
  .devhead { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .devhead .ic { width:64px; height:64px; border-radius:14px; background:#000; color:#fff; display:grid; place-items:center; }
  .devhead .ic svg { width:34px; height:34px; }
  .bigsearch { display:flex; gap:8px; } .bigsearch input { flex:1; padding:13px 16px; font-size:17px; border:2px solid #000; border-radius:10px; }

  /* ---------- modal + toast */
  .modal-bg { position:fixed; inset:0; background:rgba(10,10,10,.55); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:6vh 14px; overflow:auto; animation:fade .15s; }
  .modal { background:#fff; border-radius:14px; width:100%; max-width:560px; box-shadow:var(--shadow2); animation:pop .18s; }
  .modal.wide { max-width:820px; }
  .modal .mh { display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--line); }
  .modal .mh h3 { margin:0; font-size:16px; flex:1; }
  .modal .mb { padding:18px 20px; display:grid; gap:14px; }
  .modal .mf { display:flex; gap:8px; justify-content:flex-start; padding:14px 20px; border-top:1px solid var(--line); background:#fafafa; border-radius:0 0 14px 14px; }
  .x { border:0; background:transparent; cursor:pointer; font-size:22px; line-height:1; color:var(--muted); padding:0 4px; }
  @keyframes fade { from { opacity:0; } } @keyframes pop { from { transform:translateY(10px) scale(.98); opacity:0; } }
  #toasts { position:fixed; bottom:20px; left:20px; z-index:200; display:flex; flex-direction:column; gap:8px; }
  .toast { background:#000; color:#fff; padding:11px 16px; border-radius:10px; box-shadow:var(--shadow2); display:flex; gap:10px; align-items:center; animation:pop .2s; max-width:380px; }
  .toast.err { background:var(--red); } .toast.ok::before { content:"✓"; color:#4ade80; font-weight:700; }
  .menu { position:relative; display:inline-block; }
  .menu .dd { position:absolute; top:calc(100% + 4px); left:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow2); min-width:220px; z-index:30; padding:6px; }
  .menu .dd a { display:flex; gap:8px; align-items:center; padding:8px 10px; border-radius:6px; cursor:pointer; } .menu .dd a:hover { background:#f3f4f6; }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:300; display:grid; place-items:center; cursor:zoom-out; }
  .lightbox img { max-width:94vw; max-height:92vh; border-radius:6px; }
  .spin { width:28px; height:28px; border:3px solid #e5e7eb; border-top-color:#000; border-radius:50%; animation:sp .7s linear infinite; margin:40px auto; }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* ---------- print */
  #print-area { display:none; }
  @media print {
    #login, #app, #toasts, .modal-bg { display:none !important; }
    body { background:#fff; }
    body.p-label, html:has(body.p-label) { width:50mm; height:30mm; overflow:hidden; }
    body.p-label #print-area { display:block; overflow:hidden; width:50mm; height:30mm; padding:1.5mm 2mm; direction:ltr; font:8pt/1.2 Tahoma, sans-serif; color:#000; }
    body.p-label .big { font-size:11pt; font-weight:bold; }
    body.p-label svg { width:46mm; height:8mm; display:block; }
    body.p-doc #print-area { display:block; font:10pt/1.5 Tahoma, sans-serif; color:#000; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .doc { break-after:page; } .doc:last-child { break-after:auto; }
    .doc .hd { display:flex; align-items:center; gap:5mm; border-bottom:3px solid #000; padding-bottom:3mm; }
    .doc .hd img { width:22mm; height:22mm; }
    .doc .hd .co { flex:1; } .doc .hd .co b { font-size:17pt; display:block; } .doc .hd .co span { font-size:9.5pt; color:#444; display:block; }
    .doc .hd .no { text-align:center; border:2px solid #000; border-radius:2mm; padding:1.5mm 3mm; direction:ltr; }
    .doc .hd .no b { font-size:15pt; display:block; } .doc .hd .no span { font-size:8pt; }
    .doc .title { display:flex; justify-content:space-between; align-items:center; margin:4mm 0 3mm; }
    .doc .title h1 { font-size:15pt; margin:0; }
    .doc .tag { background:#000; color:#fff; padding:1mm 4mm; border-radius:1mm; font-size:10pt; }
    .doc .bc { text-align:center; margin-bottom:3mm; } .doc .bc svg { width:70mm; height:11mm; margin:0 auto; display:block; }
    .doc .bc div { direction:ltr; font-size:9pt; letter-spacing:1px; }
    .doc h3 { font-size:10.5pt; margin:3mm 0 1.5mm; background:#000; color:#fff; padding:1mm 3mm; }
    .doc table { border-collapse:collapse; width:100%; }
    .doc th, .doc td { border:1px solid #777; padding:1.2mm 3mm; font-size:10pt; vertical-align:top; text-align:start; }
    .doc table.kvt th { width:48mm; background:#eee; }
    .doc table.lst th { background:#eee; }
    .doc td.big { height:10mm; }
    .doc .terms { font-size:8.5pt; margin:1mm 0 0; padding-inline-start:5mm; line-height:1.55; }
    .doc .sign { display:grid; grid-template-columns:repeat(3,1fr); gap:5mm; margin-top:5mm; }
    .doc .sign > div { border:1px solid #777; padding:2mm 3mm; font-size:9pt; }
    .doc .sign b { display:block; text-align:center; margin-bottom:2mm; font-size:10pt; }
    .doc .sign p { margin:0 0 3.5mm; border-bottom:1px dotted #777; padding-bottom:.5mm; }
    .doc .sign .stamp { height:15mm; border:1px dashed #999; display:flex; align-items:center; justify-content:center; color:#999; font-size:8pt; }
    .doc .ft { margin-top:3mm; border-top:1px solid #000; padding-top:1.5mm; font-size:8pt; color:#444; display:flex; justify-content:space-between; }
    .doc .tot td { font-weight:bold; }
    .doc.compact .bc { display:none; } .doc.compact .sign p { margin-bottom:3mm; } .doc.compact .title { margin:3mm 0 1mm; }
    .doc .sign { break-inside:avoid; }
  }
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="brand"><img src="/rt-logo.jpg" alt="RT"><h1 id="lg-name">RT — قسم الصيانة</h1><p id="lg-sub">مركز صيانة الأجهزة</p></div>
  <div class="form"><div id="login-form">

async function api(path, body) {
  const r = await fetch('/api/' + path, body === undefined ? {} :
    {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== 'login') { showLogin(); throw new Error('login'); }
  if (!r.ok) {
    const e = new Error(ERR[j.error] || ('حصل خطأ: ' + (j.error || r.status))); e.code = j.error; e.status = r.status; throw e;
  }
  return j;
}
// run an action, show its error as a toast, and return null on failure
async function act(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); return r ?? true; }
  catch (e) { if (e.message !== 'login') toast(e.message, 'err'); return null; }
}
function toast(msg, kind = 'ok') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), kind === 'err' ? 5000 : 2800);
}

// Modal: fields HTML + onSubmit(form) -> close when it resolves truthy.
function modal({title, body, ok = 'حفظ', okClass = 'pri', wide = false, onOk, foot = ''}) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog"><div class="mh"><h3>${title}</h3><button class="x" data-x>×</button></div>
    <form class="mb">${body}</form>
    <div class="mf">${onOk ? `<button class="btn ${okClass}" data-ok>${ok}</button>` : ''}<button class="btn" data-x>${onOk ? 'إلغاء' : 'قفل'}</button>${foot}</div></div>`;
  const close = () => { bg.remove(); document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc_);
  bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
  bg.querySelectorAll('[data-x]').forEach(b => b.onclick = close);
  const form = bg.querySelector('form');
  const submit = async e => {
    e?.preventDefault(); const btn = bg.querySelector('[data-ok]'); if (!btn || btn.disabled) return;
    btn.disabled = true;
    try { if (await onOk(form, bg)) close(); } finally { btn.disabled = false; }
  };
  form.addEventListener('submit', submit);
  if (onOk) bg.querySelector('[data-ok]').onclick = submit;
  document.body.appendChild(bg);
  setTimeout(() => form.querySelector('input:not([type=hidden]),select,textarea')?.focus(), 30);
  return {el:bg, form, close};
}
const fv = (form, name) => form.elements[name]?.value?.trim() ?? '';
function confirmBox(title, text, ok = 'تأكيد', danger = false) {
  return new Promise(res => modal({title, body:`<p style="margin:0">${text}</p>`, ok, okClass: danger ? 'danger' : 'pri', onOk: async () => (res(true), true)})
    .el.querySelectorAll('[data-x]').forEach(b => b.addEventListener('click', () => res(false))));
}
function lightbox(src) { const d = document.createElement('div'); d.className = 'lightbox'; d.innerHTML = `<img src="${src}">`; d.onclick = () => d.remove(); document.body.appendChild(d); }
function readPhotos(files) {   // resize to max 1600px so the photos folder stays small
  return Promise.all([...files].map(f => new Promise(res => {
    const img = new Image(); img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.85)); URL.revokeObjectURL(img.src);
    }; img.src = URL.createObjectURL(f);
  })));
}
const spinner = () => '<div class="spin"></div>';
const emptyBox = (txt, ic = 'box') => `<div class="empty">${icon(ic)}${txt}</div>`;

// ================= auth & shell
function showLogin() {
  ME = null; IDLE.stop(); document.querySelectorAll('.modal-bg').forEach(m => m.remove());
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  fetch('/api/company').then(r => r.json()).then(c => {
    if (c.company_name) { $('#lg-name').textContent = c.company_name; $('#lg-sub').textContent = c.company_sub; }
    $('#login-form').classList.toggle('hidden', !!c.needs_setup); $('#setup-form').classList.toggle('hidden', !c.needs_setup);
    setTimeout(() => (c.needs_setup ? $('#su-name') : $('#lu')).focus(), 50);
  }).catch(() => {});
}
async function doSetup() {
  const err = m => { $('#suerr').textContent = m; $('#suerr').classList.remove('hidden'); };
  $('#suerr').classList.add('hidden');
  if ($('#su-pw').value !== $('#su-pw2').value) return err('كلمتين المرور مش زي بعض');
  try {
    await api('setup', {company_name:$('#su-company').value, full_name:$('#su-name').value, username:$('#su-user').value, password:$('#su-pw').value});
    boot();
  } catch (e) { err(e.message); }
}

// Auto sign-out after N minutes without mouse/keyboard (the server enforces the same limit).
const IDLE = {
  last: Date.now(), pinged: Date.now(), timer: null, warn: null,
  start() {
    this.stop(); this.last = this.pinged = Date.now();
    this.timer = setInterval(() => this.tick(), 1000);
  },
  stop() { clearInterval(this.timer); this.timer = null; this.warn?.close(); this.warn = null; },
  activity() {
    if (!this.timer || this.warn) return;
    this.last = Date.now();
    if (Date.now() - this.pinged > 30000) { this.pinged = Date.now(); api('ping').catch(() => {}); }
  },
  tick() {
    const limit = (ME?.idle_seconds || 180) * 1000, left = Math.ceil((limit - (Date.now() - this.last)) / 1000);
    if (left <= 0) { this.stop(); logout().then(() => toast('خرجت تلقائي عشان مفيش استخدام', 'err')); return; }
    if (left <= 30 && !this.warn) {
      this.warn = modal({title:'لسه موجود؟', body:`<p style="margin:0">مفيش استخدام من فترة. هتخرج تلقائي خلال <b id="idle-left" class="num">${left}</b> ثانية.</p>`,
        ok:'أيوه، لسه شغال', onOk: async () => { this.warn = null; this.last = this.pinged = Date.now(); await api('ping').catch(() => {}); return true; }});
      this.warn.el.querySelectorAll('[data-x]').forEach(b => b.addEventListener('click', () => { this.warn = null; this.last = Date.now(); }));
    }
    const el = document.getElementById('idle-left'); if (el) el.textContent = left;
  },
};
['mousemove','mousedown','keydown','scroll','touchstart','wheel'].forEach(ev => document.addEventListener(ev, () => IDLE.activity(), {passive:true, capture:true}));
async function login() {
  $('#lerr').classList.add('hidden');

  catch (e) { $('#lerr').textContent = e.message; $('#lerr').classList.remove('hidden'); }
}

async function boot() {

  [USERS, CFG] = await Promise.all([api('users'), api('settings')]);
  buildNav(); route();
}
function forcePwChange() {
  $('#view').innerHTML = ''; $('#nav').innerHTML = '';
  const m = modal({title:'لازم تغيّر كلمة المرور', body:`<div class="alert warn">${icon('warn')}<div>حسابك لسه بكلمة المرور الافتراضية. غيّرها عشان محدش غيرك يقدر يدخل بيه.</div></div>
    <label class="f">كلمة المرور الحالية<input name="o" type="password" autocomplete="current-password"></label>
    <label class="f">الجديدة (${ME.role === 'admin' ? '6' : '4'} حروف على الأقل)<input name="n" type="password" autocomplete="new-password"></label>
    <label class="f">اكتب الجديدة تاني<input name="n2" type="password" autocomplete="new-password"></label>`,
    ok:'تغيير ودخول', foot:'<span class="sp"></span><button class="btn ghost" type="button" onclick="logout()">خروج</button>', onOk: async f => {
      if (f.elements.n.value !== f.elements.n2.value) return toast('كلمتين المرور الجداد مش زي بعض', 'err');
      const r = await act(() => api('me/password', {old:f.elements.o.value, new:f.elements.n.value}), 'كلمة المرور اتغيرت');
      if (r) setTimeout(boot, 50);
      return r;
    }});
  m.el.querySelectorAll('.mh [data-x], .mf [data-x]').forEach(b => b.remove());
  m.el.onmousedown = null;
}
function buildNav() {
  const items = [['dashboard','لوحة التحكم','dash'], ['tickets', isTech() ? 'أجهزتي' : 'التذاكر','list']];
  if (canReceive()) items.push(['new','استلام جهاز','plus']);
  if (!isTech()) items.push(['device','ملف الجهاز (بحث بالسيريال)','dev'], ['customers','العملاء','users']);
  if (isMgr()) items.push(['reports','التقارير','chart']);
  if (ME.role === 'admin') items.push(['settings','الإعدادات والمستخدمين','cog']);
  $('#nav').innerHTML = items.map(([k, t, i]) => `<a data-k="${k}" href="#/${k}">${icon(i)}<span>${t}</span></a>`).join('');
}
function nav(path) { location.hash = '#/' + path; }
window.addEventListener('hashchange', route);
function route() {
  if (!ME) return;
  document.body.classList.remove('nav-open');
  const [v, ...rest] = location.hash.replace(/^#\/?/, '').split('/');
  const arg = rest.length ? decodeURIComponent(rest.join('/')) : '';
  const views = {dashboard:viewDash, tickets:viewTickets, ticket:viewTicket, new:viewNew, device:viewDevice, customers:viewCustomers,
    customer:viewCustomer, reports:viewReports, settings:viewSettings};
  const fn = views[v] || viewDash;
  const navKey = {ticket:'tickets', customer:'customers'}[v] || v || 'dashboard';
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.k === navKey));
  $('#view').innerHTML = spinner(); window.scrollTo(0, 0);
  fn(arg).catch(e => { if (e.message !== 'login') $('#view').innerHTML = `<div class="alert err">${icon('warn')}<div>${esc(e.message)}</div></div>`; });
}

    const ok = await api('tickets/' + v.replace('#', '')).then(() => true).catch(() => false);

});

let LIST = {q:'', status:'', type:'', tech:'', priority:'', overdue:'', approval:'', offset:0};
async function viewTickets(arg) {
  const [q, preset] = (arg || '').split('/');
  LIST = {q: q || '', status:'', type:'', tech:'', priority:'', overdue:'', approval:'', offset:0};
  if (preset === 'open' || ST[preset]) LIST.status = preset;
  if (preset === 'overdue') LIST.overdue = '1';
  if (preset === 'urgent') { LIST.priority = 'urgent'; LIST.status = 'open'; }
  if (preset === 'approval') LIST.approval = 'pending';
  const techs = USERS.filter(u => ['technician','manager','admin'].includes(u.role));
  $('#view').innerHTML = `
  <div class="page-h"><h1>${isTech() ? 'استلاماتي والأجهزة المعيّنة ليا' : 'التذاكر'}</h1><span class="sp"></span>

      <select id="ft"><option value="">كل الأنواع</option>${Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
      ${isTech() ? '' : `<select id="ftech"><option value="">كل الفنيين</option><option value="none">لسه ماتعيّنش</option>${techs.map(u => `<option value="${u.id}">${esc(u.full_name)}</option>`).join('')}</select>`}
      <select id="fp"><option value="">كل الأولويات</option><option value="urgent">مستعجل بس</option></select>
      <label class="row small" style="cursor:pointer"><input type="checkbox" id="fo" ${LIST.overdue ? 'checked' : ''}> المتأخر بس</label>
      <label class="row small" style="cursor:pointer"><input type="checkbox" id="fa" ${LIST.approval ? 'checked' : ''}> مستني موافقة</label>
    </div>
    <div class="pills" id="fs">${[['', 'الكل'], ['open', 'المفتوح'], ...Object.entries(ST)].map(([k, v]) => `<a data-s="${k}">${v}</a>`).join('')}</div>
  </div>
  <div class="card flush"><div class="tbl-wrap" id="rows">${spinner()}</div><div class="pager" id="pager"></div></div>`;
  $('#fp').value = LIST.priority;
  const reload = () => { LIST.offset = 0; loadTickets(); };
  let tm; $('#fq').oninput = () => { clearTimeout(tm); tm = setTimeout(() => { LIST.q = $('#fq').value.trim(); reload(); }, 300); };
  $('#ft').onchange = e => { LIST.type = e.target.value; reload(); };
  if ($('#ftech')) $('#ftech').onchange = e => { LIST.tech = e.target.value; reload(); };
  $('#fp').onchange = e => { LIST.priority = e.target.value; reload(); };
  $('#fo').onchange = e => { LIST.overdue = e.target.checked ? '1' : ''; reload(); };
  $('#fa').onchange = e => { LIST.approval = e.target.checked ? 'pending' : ''; reload(); };
  document.querySelectorAll('#fs a').forEach(a => a.onclick = () => { LIST.status = a.dataset.s; reload(); });
  loadTickets();
}
async function loadTickets() {
  document.querySelectorAll('#fs a').forEach(a => a.classList.toggle('on', a.dataset.s === LIST.status));
  const r = await api('tickets?' + qs({...LIST, limit:50}));
  $('#rows').innerHTML = ticketTable(r.rows) || emptyBox('مفيش تذاكر بالشروط دي');
  const from = r.total ? LIST.offset + 1 : 0, to = Math.min(LIST.offset + 50, r.total);
  $('#pager').innerHTML = `<span class="muted">عرض <b class="num">${from}–${to}</b> من <b class="num">${r.total}</b></span><span class="sp"></span>
    <button class="btn sm" ${LIST.offset ? '' : 'disabled'} onclick="LIST.offset-=50;loadTickets()">السابق</button>
    <button class="btn sm" ${to < r.total ? '' : 'disabled'} onclick="LIST.offset+=50;loadTickets()">التالي</button>`;
}

async function createTicket(force = false) {
  const body = {serial:$('#n-serial').value, intake_type:document.querySelector('input[name=itype]:checked').value,
    priority:document.querySelector('input[name=prio]:checked').value, due_days:$('#n-due').value,
    customer_id:$('#n-cid').value || null, customer_name:$('#n-cn').value, customer_phone:$('#n-cp').value,
    customer_phone2:$('#n-cp2').value, customer_company:$('#n-cco').value,
    device_type:$('#n-dt').value, brand:$('#n-br').value, model:$('#n-md').value, accessories:$('#n-acc').value,
    condition:$('#n-cond').value, complaint:$('#n-cmp').value, password_note:$('#n-pw').value,
    assign_to:$('#n-tech')?.value || null, photos:NEW_PHOTOS, force};
  if (!body.complaint.trim()) return toast('اكتب العطل حسب كلام العميل', 'err');
  $('#n-save').disabled = true;
  try {
    const r = await api('tickets', body);
    modal({title:`✓ اتعملت تذكرة #${r.id}`, body:`
      ${r.first_visit ? `<div class="alert new">${icon('star')}<div>الجهاز ده أول مرة يدخل الورشة، واتسجل في ملفات الأجهزة.</div></div>` : ''}
      ${r.under_warranty ? `<div class="alert ok">${icon('shield')}<div>الجهاز راجع وهو لسه في الضمان، واتعلّم على التذكرة.</div></div>` : ''}
      <p style="margin:0">اطبع للعميل إيصال الاستلام، والزق الاستيكر على الجهاز.</p>
      <div class="row"><button type="button" class="btn pri" onclick="printIntake(${r.id})">${icon('print')} إيصال استلام A4</button>
        <button type="button" class="btn" onclick="printLabel(${r.id})">${icon('print')} استيكر الجهاز</button></div>`,
      ok:'افتح التذكرة', onOk: async () => (nav('ticket/' + r.id), true)});
    nav('ticket/' + r.id);
  } catch (e) {
    if (e.code?.startsWith('device_open:')) {
      const id = e.code.split(':')[1];
      if (await confirmBox('الجهاز جوه الورشة', `الجهاز ده عنده تذكرة مفتوحة <a href="#/ticket/${id}">#${id}</a>. عايز تفتح تذكرة جديدة برضه؟`, 'أيوه افتح تذكرة جديدة'))
        return createTicket(true);
    } else if (e.message !== 'login') toast(e.message, 'err');
  } finally { const b = $('#n-save'); if (b) b.disabled = false; }
}

let TK = null, TK_TAB = 'overview';
async function viewTicket(id) {
  TK = await api('tickets/' + id);
  renderTicket();
}
function renderTicket() {
  const t = TK, closed = ['delivered','rejected'].includes(t.status);
  const canWork = isMgr() || (isTech() && t.assigned_to === ME.id);
  const flow = ['received','assigned','in_repair','repaired','delivered'];
  const curI = flow.indexOf(t.status === 'waiting_customer' || t.status === 'waiting_parts' ? 'in_repair' : t.status);
  const btn = (txt, fn, cls = '') => `<button class="btn ${cls}" onclick="${fn}">${txt}</button>`;
  const actions = [];
  if (isMgr() && !closed) actions.push(btn('👤 تعيين فني', 'mAssign()'));
  if ((canWork || isFront()) && !closed) actions.push(btn('🔄 تغيير الحالة', 'mStatus()'));
  if (canWork && !closed) actions.push(btn('🩺 تشخيص وعرض سعر', 'mDiagnosis()'));
  if (canHandleCustomer() && !closed) actions.push(btn('💰 إضافة بند صيانة', 'mServiceItem()'));
  if (canHandleCustomer() && t.approval === 'pending') actions.push(btn('✋ رد العميل', 'mApproval()', 'pri'));
  if (canWork && !closed) actions.push(btn('🛠 إضافة شغل', 'mNote()'), btn('🔩 إضافة قطعة', 'mPart()'));
  if (canHandleCustomer() && !closed) actions.push(btn('📦 تسليم للعميل', 'mDeliver()', t.status === 'repaired' ? 'ok' : ''));
  if (isMgr() && closed) actions.push(btn('↩ إعادة فتح', 'mReopen()'));
  if (ME.role === 'admin') actions.push('<span class="sp"></span>' + btn('🗑 مسح التذكرة', 'mDelete()', 'danger'));
  $('#view').innerHTML = `
  <div class="page-h">
    <div><div class="row"><h1>تذكرة <span class="num">#${t.id}</span></h1>${stChip(t.status)}${typeChip(t.intake_type)}
      ${t.priority === 'urgent' ? chip('مستعجل', 'red') : ''}${t.overdue ? chip('متأخر', 'red', 'nodot') : ''}
      ${t.first_visit ? '<span class="chip c-black nodot">⭐ أول دخول للورشة</span>' : ''}${t.under_warranty ? chip('راجع في الضمان', 'pink') : ''}
      ${t.approval !== 'none' ? chip(APPROVAL[t.approval], {pending:'amber', approved:'green', rejected:'red'}[t.approval]) : ''}</div>
      <div class="sub">دخل ${fmtD(t.received_at)} · ${ago(t.received_at)} · استلمه ${esc(t.received_by_name)}</div></div>
    <span class="sp"></span>
    <div class="menu"><button class="btn" onclick="this.nextElementSibling.classList.toggle('hidden')">${icon('print')} طباعة ▾</button>
      <div class="dd hidden" onmouseleave="this.classList.add('hidden')">
        <a onclick="printLabel(${t.id})">🏷 استيكر الجهاز (زيبرا USB)</a>
        <a onclick="printZebra(${t.id})">📡 استيكر — إرسال للزيبرا على الشبكة</a>
        <a onclick="printIntake(${t.id})">🧾 إيصال استلام A4</a>
        ${t.status === 'delivered' || t.status === 'repaired' ? `<a onclick="printDelivery(${t.id})">📄 إيصال تسليم وفاتورة A4</a>` : ''}
      </div></div>
    ${!isTech() && t.customer_phone ? `<button class="btn" onclick="whatsapp()">${icon('wa')} واتساب</button>` : ''}
  </div>
  <div class="card">
    <div class="steps">${flow.map((s, i) => `${i ? `<div class="ln ${i <= curI ? 'done' : ''}"></div>` : ''}<div class="s ${i < curI || (i === curI && s === 'delivered') ? 'done' : i === curI ? 'cur' : ''}"><i>${i < curI || s === 'delivered' && i === curI ? '✓' : i + 1}</i>${ST[s]}</div>`).join('')}</div>
    ${t.status === 'rejected' ? `<div class="alert err" style="margin:12px 0 0">${icon('warn')}<div>التذكرة اتقفلت مرفوضة / مرتجعة.</div></div>` : ''}
    ${['waiting_customer','waiting_parts'].includes(t.status) ? `<div class="alert warn" style="margin:12px 0 0">${icon('info')}<div>${ST[t.status]}${t.estimate != null && t.status === 'waiting_customer' ? ` — عرض السعر: <b>${money(t.estimate)}</b>` : ''}</div></div>` : ''}
    <div class="row" style="margin-top:14px">${actions.join('') || '<span class="muted small">مفيش إجراءات متاحة ليك على التذكرة دي</span>'}</div>
  </div>
  <div class="tabs" id="tabs">${[['overview','نظرة عامة'], ['work','الشغل والقطع', t.notes.length + t.parts.length + t.services.length], ...(isTech() ? [] : [['money','الحساب']]),
    ['photos','الصور', t.photos.length], ['history','السجل', t.history.length]].map(([k, l, n]) =>
    `<a data-t="${k}" class="${TK_TAB === k ? 'on' : ''}">${l}${n ? `<span class="n num">${n}</span>` : ''}</a>`).join('')}</div>
  <div id="tab"></div>`;
  document.querySelectorAll('#tabs a').forEach(a => a.onclick = () => { TK_TAB = a.dataset.t; renderTicket(); });
  if (isTech() && TK_TAB === 'money') TK_TAB = 'overview';
  ({overview:tabOverview, work:tabWork, money:tabMoney, photos:tabPhotos, history:tabHistory})[TK_TAB]();
}

      ${t.delivered_to ? `<div><span>استلمه</span><b>${esc(t.delivered_to)}</b></div>` : ''}
      ${t.warranty_until ? `<div><span>ضمان لحد</span><b class="num">${t.warranty_until}</b></div>` : ''}
      ${isTech() ? '' : `<div><span>الإجمالي</span><b>${money(t.total)}</b></div><div><span>الباقي</span><b style="${t.balance > 0 ? 'color:var(--red)' : ''}">${money(t.balance)}</b></div>`}

function tabHistory() {
  $('#tab').innerHTML = `<div class="card"><div class="tl">${TK.history.map(h => `<div class="it" style="--dot:${h.action === 'status' ? ST_HEX[(h.detail || '').split(' -> ')[1]?.split(' ')[0]] || '#000' : '#000'}">
    <b>${esc(histText(h))}</b><div class="muted small">${esc(h.user_name)} · ${fmtD(h.created_at)}</div></div>`).join('')}</div></div>`;
}
function histText(h) {
  const a = {created:'فتح التذكرة', assigned:'تعيين فني', status:'تغيير حالة', note:'إضافة شغل', part_added:'تركيب قطعة', part_removed:'حذف قطعة',
    photos:'رفع صور', label_printed:'طباعة استيكر على الشبكة', diagnosis:'تشخيص', approval:'رد العميل', charges:'تعديل المصنعية والخصم',
    estimate:'تحديث إجمالي عرض السعر', service_added:'إضافة بند صيانة', service_priced:'تسعير بند صيانة',
    part_priced:'تسعير قطعة', payment:'تسجيل دفعة', delivered:'تسليم للعميل',
    reopened:'إعادة فتح التذكرة', edited:'تعديل بيانات الجهاز', printed:'طباعة'}[h.action] || h.action;
  let d = h.detail || '';
  if (h.action === 'created') { const [ty, n, ...f] = d.split('|'); d = [TYPES[ty] || ty, n ? `${n} صور` : '', f.includes('first') ? 'أول دخول' : '', f.includes('warranty') ? 'في الضمان' : ''].filter(Boolean).join('، '); }
  else if (h.action === 'status') d = d.replace(/^(\w+) -> (\w+)/, (_, x, y) => `${ST[x] || x} ← ${ST[y] || y}`);
  else if (h.action === 'note') d = KIND[d] || d;
  else if (h.action === 'photos') d = d.replace(/(\d+) (\w+)/, (_, n, s) => `${n} ${({intake:'استلام', repair:'صيانة', delivery:'تسليم'})[s] || s}`);
  else if (h.action === 'approval') d = d.replace(/^approved/, 'وافق').replace(/^rejected/, 'رفض');
  else if (h.action === 'payment') { const [m, w] = d.split('|'); d = `${m} ${cur()} ${PAY[w] || ''}`; }
  else if (h.action === 'charges') { const [l, ds] = d.split('|'); d = `مصنعية ${l} · خصم ${ds}`; }
  else if (h.action === 'estimate') d = `إجمالي عرض السعر ${d} ${cur()}`;
  else if (['service_added','service_priced','part_priced'].includes(h.action)) {
    const [name, price] = d.split('|'); d = `${name} · ${price} ${cur()}`;
  }
  else if (h.action === 'delivered') { const [n, w] = d.split('|'); d = `${n}${+w ? ` · ضمان ${w} يوم` : ''}`; }
  else if (h.action === 'diagnosis') { const [e, ask] = d.split('|'); d = (e ? `عرض سعر ${e} ${cur()}` : '') + (ask ? ' · اتبعت للعميل' : ''); }
  else if (h.action === 'printed') d = {intake:'إيصال استلام', delivery:'إيصال تسليم', label:'استيكر'}[d] || d;
  return d ? `${a}: ${d}` : a;
}

// ---- ticket modals
const reload = async () => { TK = await api('tickets/' + TK.id); renderTicket(); };
const tAct = (sub, body, msg) => act(async () => { await api(`tickets/${TK.id}/${sub}`, body); await reload(); }, msg);
function mAssign() {
  const techs = USERS.filter(u => u.active && ['technician','manager','admin'].includes(u.role));
  modal({title:'تعيين فني', body:`<label class="f">الفني<select name="u">${techs.map(u => `<option value="${u.id}" ${u.id === TK.assigned_to ? 'selected' : ''}>${esc(u.full_name)} — ${ROLE[u.role]}</option>`).join('')}</select></label>`,
    ok:'تعيين', onOk: f => tAct('assign', {user_id:+fv(f, 'u')}, 'اتعيّن الفني')});
}
function mStatus() {
  const allowed = Object.keys(ST).filter(s => s !== 'delivered' && (isMgr() || (isTech() ? true : ['waiting_customer','rejected'].includes(s))));
  modal({title:'تغيير الحالة', body:`<label class="f">الحالة الجديدة<div class="seg">${allowed.map(s => `<label><input type="radio" name="s" value="${s}" ${s === TK.status ? 'checked' : ''}><span>${ST[s]}</span></label>`).join('')}</div></label>
    <label class="f">ملاحظة (اختياري)<input name="n" placeholder="مثلاً: مستنيين شاشة من المورد"></label>`,
    onOk: f => tAct('status', {status:f.querySelector('input[name=s]:checked')?.value, note:fv(f, 'n')}, 'الحالة اتغيرت')});
}
function mDiagnosis() {

}

    onOk: f => tAct('service_price', {id, price:fv(f, 'p')}, 'سعر بند الصيانة اتحدّث')});

async function viewDevice(serial) {
  if (isTech()) return nav('tickets');
  $('#view').innerHTML = `<div class="page-h"><div><h1>ملف الجهاز</h1><div class="sub">اكتب السيريال أو امسحه بالباركود وشوف كل تاريخ الجهاز في الورشة</div></div></div>
    <div class="card"><div class="bigsearch"><input id="ds" class="mono" placeholder="السيريال..." value="${esc(serial)}"><button class="btn pri lg" onclick="nav('device/'+encodeURIComponent($('#ds').value.trim()))">بحث</button></div></div>
    <div id="dres"></div>`;
  $('#ds').addEventListener('keydown', e => e.key === 'Enter' && nav('device/' + encodeURIComponent(e.target.value.trim())));
  if (!serial) return $('#ds').focus();
  const dev = await api('devices/' + encodeURIComponent(serial)).catch(e => { if (e.code === 'device_not_found') return null; throw e; });
  if (!dev) {
    const near = (await api('tickets?' + qs({q:serial, limit:200}))).rows;
    const serials = [...new Map(near.map(t => [t.serial.toUpperCase(), t])).values()].slice(0, 20);
    $('#dres').innerHTML = serials.length ? `<div class="card"><h3>مفيش جهاز بالسيريال ده بالظبط — يمكن تقصد:</h3><div class="row">${serials.map(t =>
      `<a class="btn" href="#/device/${encodeURIComponent(t.serial)}"><span class="mono">${esc(t.serial)}</span> · ${esc(devName(t))} · ${esc(t.customer_name)}</a>`).join('')}</div></div>`
      : `<div class="card">${emptyBox(`السيريال <b class="mono">${esc(serial)}</b> مادخلش الورشة قبل كده.`, 'dev')}
      ${canReceive() ? `<div style="text-align:center"><button class="btn pri" onclick="nav('new');setTimeout(()=>{$('#n-serial').value=${JSON.stringify(serial).replace(/"/g, '&quot;')};lookupSerial()},300)">استلمه دلوقتي</button></div>` : ''}</div>`;
    return;
  }
  const v = dev.visits, first = v[v.length - 1];
  $('#dres').innerHTML = `
  <div class="card"><div class="devhead"><div class="ic">${icon('dev')}</div>
    <div><h1 class="mono" style="font-size:24px">${esc(dev.serial)}</h1><div style="font-size:16px">${esc(devName(dev))}</div>
      <div class="muted small">المالك الحالي: ${dev.customer_id ? `<a href="#/customer/${dev.customer_id}">${esc(dev.customer_name)}</a> <span class="num">${esc(dev.customer_phone)}</span>` : '—'}</div></div>
    <span class="sp"></span>
    <div class="row">${dev.open_ticket ? `<a class="btn" href="#/ticket/${dev.open_ticket}">جوه الورشة دلوقتي: #${dev.open_ticket}</a>` : ''}
      ${dev.in_warranty ? chip(`في الضمان لحد ${dev.warranty_until}`, 'green') : dev.warranty_until ? chip(`الضمان خلص ${dev.warranty_until}`, 'gray') : ''}</div></div></div>
  <div class="alert ${dev.first_intake_type === 'setup' ? 'new' : 'info'}">${icon('star')}<div>
    <b>أول دخول للورشة:</b> <span class="num">${fmtD(dev.first_seen_at)}</span> — ${TYPES[dev.first_intake_type] || dev.first_intake_type}
    ${first ? ` (تذكرة <a href="#/ticket/${first.id}">#${first.id}</a>)` : ''}${dev.first_intake_type === 'setup' ? ' — الجهاز دخل أول مرة للتهيئة.' : ''}</div></div>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="kpi" style="--k:#000"><div class="l">عدد مرات الدخول</div><div class="v num">${v.length}</div></div>
    <div class="kpi" style="--k:var(--blue)"><div class="l">قطع غيار اتركبت</div><div class="v num">${dev.parts_count}</div></div>
    <div class="kpi" style="--k:var(--green)"><div class="l">إجمالي اللي اتصرف</div><div class="v" style="font-size:20px">${money(dev.total_spent)}</div></div>
    <div class="kpi" style="--k:var(--amber)"><div class="l">آخر دخول</div><div class="v num" style="font-size:20px">${day(v[0]?.received_at)}</div></div>
  </div>
  <div class="card"><h2>تاريخ الجهاز في الورشة</h2><div class="tl">
    ${v.map((t, i) => {
      const prev = v[i + 1], gap = prev?.closed_at ? Math.round((new Date(t.received_at.replace(' ', 'T')) - new Date(prev.closed_at.replace(' ', 'T'))) / 864e5) : null;
      return `<div class="it" style="--dot:${ST_HEX[t.status]}">
      <div class="row"><a href="#/ticket/${t.id}"><b class="num">#${t.id}</b></a> ${typeChip(t.intake_type)} ${stChip(t.status)}
        ${t.under_warranty ? chip('في الضمان', 'pink') : ''}${gap !== null && gap <= 30 ? chip(`رجع بعد ${gap} يوم بس`, 'red', 'nodot') : ''}
        <span class="muted small num">${fmtD(t.received_at)}${t.closed_at ? ' ← ' + fmtD(t.closed_at) : ''}</span></div>
      <div class="note" style="margin-top:8px"><div class="h">العطل: ${esc(t.complaint) || '—'}</div>
        ${t.diagnosis ? `<p><b>التشخيص:</b> ${esc(t.diagnosis)}</p>` : ''}
        ${t.notes.map(n => `<p>• <b>${KIND[n.kind] || n.kind}:</b> ${esc(n.text)}</p>`).join('')}
        ${t.parts.length ? `<p style="margin-top:6px"><b>القطع:</b> ${t.parts.map(p => `${esc(p.name)}${p.serial ? ` <span class="mono small">(${esc(p.serial)})</span>` : ''} ×${p.qty}`).join('، ')}</p>` : ''}
        <div class="h" style="margin:6px 0 0">الفني: ${esc(t.assigned_to_name) || '—'} · العميل: ${esc(t.customer_name)} · الإجمالي: ${money(t.total)}</div></div></div>`; }).join('')}
  </div></div>`;
}

  $('#view').innerHTML = `<div class="page-h"><h1>التقارير</h1><span class="sp"></span>
    <div class="filters"><label class="small">من <input type="date" id="rf" value="${from0}"></label><label class="small">لحد <input type="date" id="rt" value="${to0}"></label>
    <button class="btn pri" onclick="loadReport()">عرض</button><a class="btn" id="rx">⬇ تصدير Excel</a></div></div><div id="rres">${spinner()}</div>`;
  loadReport();

async function loadReport() {
  const p = qs({from:$('#rf').value, to:$('#rt').value});
  $('#rx').href = '/api/reports/export?' + p;
  const r = await api('reports/summary?' + p);
  const mx = a => Math.max(1, ...a.map(x => x.n));

// ================= printing
// Sets the page size for this print only, then cleans up.
function printWith(cls, size, margin) {
  const st = document.createElement('style');
  st.textContent = `@page { size:${size}; margin:${margin}; }`;
  document.head.appendChild(st); document.body.classList.add(cls);
  window.print();
  document.body.classList.remove(cls); st.remove();
}

// Code 128-B barcode as SVG (printable ASCII only).
function code128(text) {
  const P = '212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112'.split(' ');
  const s = [...String(text)].filter(c => c >= ' ' && c <= '~');
  const codes = [104, ...s.map(c => c.charCodeAt(0) - 32)];
  codes.push(codes.reduce((a, c, i) => a + c * (i || 1), 0) % 103, 106);
  let x = 10, bars = '';
  for (const c of codes) [...P[c]].forEach((w, i) => { if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="40"/>`; x += +w; });
  return `<svg viewBox="0 0 ${x + 10} 40" preserveAspectRatio="none">${bars}</svg>`;
}
